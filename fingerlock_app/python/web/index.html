<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FingerLock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap">
<style>
  :root {
    --void: #02040a;      /* page background */
    --deep: #070d1a;      /* panels */
    --edge: #13213b;      /* borders */
    --saber: #3d8bff;     /* lightsaber blue */
    --core: #eaf4ff;      /* white-hot core */
    --text: #a9bddf;
    --dim: #5d7091;
    --open: #5cf2c4;
    --danger: #ff4f6d;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--edge); }
  h1 { margin: 0; font: 600 22px/1 var(--display); color: var(--core); letter-spacing: .02em; }
  h1 span { color: var(--saber); text-shadow: 0 0 12px rgba(61,139,255,.7); }
  .pill { font: 600 14px/1 var(--display); padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--edge); color: var(--dim); }
  .pill[data-s="reading"], .pill[data-s="opening"], .pill[data-s="closing"] {
    color: var(--core); border-color: var(--saber); box-shadow: 0 0 14px rgba(61,139,255,.55), inset 0 0 8px rgba(61,139,255,.35); }
  .pill[data-s="open"] { color: var(--open); border-color: var(--open); box-shadow: 0 0 14px rgba(92,242,196,.4); }
  .pill[data-s="denied"], .pill[data-s="lockout"] { color: var(--danger); border-color: var(--danger); }

  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  aside { padding: 22px; border-right: 1px solid var(--edge); display: flex; flex-direction: column; gap: 20px; }

  .slots { display: flex; gap: 14px; }
  .slot { --p: 0; width: 64px; height: 64px; border-radius: 50%; position: relative;
    background: conic-gradient(var(--saber) calc(var(--p) * 360deg), var(--edge) 0);
    display: grid; place-items: center; }
  .slot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--deep); }
  .slot b { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; background: transparent; }
  .slot.filled { background: var(--saber); box-shadow: 0 0 16px rgba(61,139,255,.6); }
  .slot.filled b { background: var(--core); box-shadow: 0 0 10px #fff, 0 0 18px var(--saber); }
  .slot.active { --p: 0; }

  #msg { margin: 0; color: var(--core); min-height: 3em; max-width: 32ch; }
  #msg.err { color: var(--danger); }

  .seeing { display: flex; align-items: baseline; gap: 10px; }
  .seeing strong { font: 600 44px/1 var(--display); color: var(--core); min-width: 1.2ch;
    text-shadow: 0 0 16px rgba(61,139,255,.8); }
  .seeing span { color: var(--dim); }
  .meter { height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--saber); box-shadow: 0 0 10px var(--saber); }
  .meter-label { font-size: 13px; color: var(--dim); margin-top: 6px; min-height: 1.5em; }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: 600 16px/1 var(--display); padding: 13px 22px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--saber); background: transparent; color: var(--core); }
  button.primary { background: var(--saber); color: #fff; box-shadow: 0 0 18px rgba(61,139,255,.55); }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  button:focus-visible { outline: 2px solid var(--core); outline-offset: 3px; }
  #toast { min-height: 1.5em; font-size: 13px; color: var(--dim); margin: -8px 0 0; }

  figure { margin: 0; }
  #cam { width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: 1px solid var(--edge);
    background: var(--deep); display: block; object-fit: cover; }
  figcaption { font-size: 13px; color: var(--dim); margin-top: 6px; }

  .viz { padding: 14px 14px 10px; display: flex; flex-direction: column; min-width: 0; }
  .scroll { flex: 1; overflow-x: auto; min-height: 420px; }
  canvas { display: block; width: 100%; min-width: 900px; height: 100%; min-height: 420px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--dim); padding: 8px 4px 0; }
  .legend i { width: 220px; height: 8px; border-radius: 4px; display: block; }
  .legend .note { margin-left: auto; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--edge); }
    .scroll { min-height: 380px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Finger<span>Lock</span></h1>
  <div class="pill" id="pill" data-s="locked" role="status">Connecting</div>
</header>

<main>
  <aside>
    <div class="slots" id="slots" aria-label="Code progress"></div>
    <p id="msg" aria-live="polite">Connecting to the lock...</p>

    <div>
      <div class="seeing"><strong id="pred">–</strong><span id="conf">The camera sees</span></div>
      <div class="meter" style="margin-top:10px"><i id="hold"></i></div>
      <div class="meter-label" id="holdLabel"></div>
    </div>

    <div class="buttons">
      <button class="primary" id="startBtn">Start</button>
      <button id="closeBtn" disabled>Close safe</button>
    </div>
    <p id="toast" aria-live="polite"></p>

    <figure>
      <img id="cam" alt="Live camera view">
      <figcaption id="camCap">Camera</figcaption>
    </figure>
  </aside>

  <section class="viz">
    <div class="scroll"><canvas id="net" aria-label="Live view of the neural network's activations"></canvas></div>
    <div class="legend"><span>Resting</span><i id="legendBar"></i><span>Firing</span>
      <span class="note">Each square is one neuron. Brightness is relative to how that layer usually fires.</span></div>
  </section>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);

// ---------- color: dark -> lightsaber blue -> white-hot ----------
const STOPS = [[0, [8, 13, 28]], [0.30, [14, 42, 128]], [0.62, [48, 128, 255]], [0.86, [180, 218, 255]], [1, [255, 255, 255]]];
const LUT = new Uint8ClampedArray(256 * 3);
for (let i = 0; i < 256; i++) {
  const t = i / 255;
  let a = STOPS[0], b = STOPS[STOPS.length - 1];
  for (let s = 0; s < STOPS.length - 1; s++) if (t >= STOPS[s][0] && t <= STOPS[s + 1][0]) { a = STOPS[s]; b = STOPS[s + 1]; break; }
  const u = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
  for (let c = 0; c < 3; c++) LUT[i * 3 + c] = a[1][c] + (b[1][c] - a[1][c]) * u;
}
const color = (v, alpha = 1) => { const i = Math.max(0, Math.min(255, v | 0)) * 3; return `rgba(${LUT[i]},${LUT[i + 1]},${LUT[i + 2]},${alpha})`; };
$("#legendBar").style.background = `linear-gradient(90deg, ${[0, 64, 128, 192, 255].map(v => color(v)).join(",")})`;

// Can the browser blur a canvas? (used for the glow)
const FILTER_OK = (() => { const c = document.createElement("canvas").getContext("2d");
  if (!("filter" in c)) return false; c.filter = "blur(2px)"; return c.filter === "blur(2px)"; })();

// ---------- canvas setup ----------
const canvas = $("#net"), ctx = canvas.getContext("2d");
const scene = document.createElement("canvas"), sctx = scene.getContext("2d");
const layerCache = {};
let previewCv = null;
const FONT = (px, w = 600) => `${w} ${px}px "Chakra Petch", "Segoe UI", system-ui, sans-serif`;

function fitCanvas() {
  const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = scene.width = W; canvas.height = scene.height = H; }
  return dpr;
}

function bestGrid(n, w, h, boxW, boxH) {          // most columns/rows layout that gives the biggest tiles
  let best = { s: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols), gw = cols * w + (cols - 1), gh = rows * h + (rows - 1);
    const s = Math.min(boxW / gw, boxH / gh);
    if (s > best.s) best = { s, cols, rows, gw, gh };
  }
  return best;
}

function render(h, payload) {
  const dpr = fitCanvas(), W = canvas.width, H = canvas.height;
  const top = 48 * dpr, bottom = 10 * dpr, gap = 18 * dpr, pad = 8 * dpr;

  // columns: input | block1..N | dense | answer
  const cols = [{ kind: "input", wt: 1.35, title: "What the net sees", sub: `${h.seen.w}×${h.seen.h} gray` }];
  h.layers.forEach((l, i) => cols.push({ kind: "layer", l, wt: Math.max(0.8, 1.3 - i * 0.1),
    title: `Block ${i + 1}`, sub: `${l.c} maps at ${l.full[1]}×${l.full[0]}` }));
  cols.push({ kind: "fc", wt: 0.42, title: "Dense", sub: `${h.fc.length} neurons` },
            { kind: "out", wt: 0.75, title: "Answer", sub: "probability" });
  const totalWt = cols.reduce((s, c) => s + c.wt, 0), avail = W - 2 * pad - gap * (cols.length - 1);
  let x = pad;
  for (const c of cols) { c.x = x; c.w = avail * c.wt / totalWt; c.y = top; c.h = H - top - bottom; x += c.w + gap; }

  sctx.fillStyle = "#02040a"; sctx.fillRect(0, 0, W, H);
  sctx.imageSmoothingEnabled = false;            // crisp squares: one square per neuron

  // conv blocks
  for (const c of cols.filter(c => c.kind === "layer")) {
    const l = c.l, g = bestGrid(l.c, l.w, l.h, c.w, c.h);
    let lc = layerCache[l.name];
    if (!lc || lc.cv.width !== g.gw || lc.cv.height !== g.gh) {
      const cv = document.createElement("canvas"); cv.width = g.gw; cv.height = g.gh;
      const cx = cv.getContext("2d"), img = cx.createImageData(g.gw, g.gh);
      for (let i = 0; i < img.data.length; i += 4) { img.data[i] = 2; img.data[i + 1] = 4; img.data[i + 2] = 10; img.data[i + 3] = 255; }
      lc = layerCache[l.name] = { cv, cx, img };
    }
    const d = lc.img.data, per = l.h * l.w;
    for (let ch = 0; ch < l.c; ch++) {
      const ox = (ch % g.cols) * (l.w + 1), oy = Math.floor(ch / g.cols) * (l.h + 1), base = l.offset + ch * per;
      for (let yy = 0; yy < l.h; yy++) {
        let di = ((oy + yy) * g.gw + ox) * 4, si = base + yy * l.w;
        for (let xx = 0; xx < l.w; xx++, di += 4, si++) {
          const v = payload[si] * 3; d[di] = LUT[v]; d[di + 1] = LUT[v + 1]; d[di + 2] = LUT[v + 2];
        }
      }
    }
    lc.cx.putImageData(lc.img, 0, 0);
    const dw = g.gw * g.s, dh = g.gh * g.s;
    sctx.drawImage(lc.cv, c.x + (c.w - dw) / 2, c.y, dw, dh);
  }

  // answer bars (positions needed for the lines)
  const out = cols.find(c => c.kind === "out");
  const rowH = Math.min(52 * dpr, out.h / h.probs.length), outTop = out.y + (out.h - rowH * h.probs.length) / 2;
  const barX = out.x + 26 * dpr, barMax = out.w - 30 * dpr, barH = rowH * 0.5;
  const winner = h.probs.indexOf(Math.max(...h.probs));
  const barY = i => outTop + i * rowH + (rowH - barH) / 2;

  // dense neurons
  const fcCol = cols.find(c => c.kind === "fc"), nRows = Math.ceil(h.fc.length / 4);
  const pitchX = fcCol.w / 4, pitchY = Math.min(fcCol.h / nRows, pitchX * 1.6);
  const rad = Math.max(2, Math.min(pitchX, pitchY) * 0.34), fcTop = fcCol.y + (fcCol.h - pitchY * nRows) / 2;
  const fcPos = h.fc.map((_, j) => [fcCol.x + pitchX * (j % 4 + 0.5), fcTop + pitchY * (Math.floor(j / 4) + 0.5)]);

  sctx.lineWidth = Math.max(1, dpr);
  for (const [j, v] of h.lines) {                // neurons that pushed toward the answer
    sctx.strokeStyle = color(140 + v * 115, 0.25 + 0.6 * v);
    sctx.beginPath(); sctx.moveTo(fcPos[j][0] + rad, fcPos[j][1]); sctx.lineTo(barX - 4 * dpr, barY(winner) + barH / 2); sctx.stroke();
  }
  h.fc.forEach((v, j) => { sctx.fillStyle = color(v); sctx.beginPath(); sctx.arc(fcPos[j][0], fcPos[j][1], rad, 0, Math.PI * 2); sctx.fill(); });

  h.probs.forEach((p, i) => {
    sctx.fillStyle = "#0b1326"; sctx.fillRect(barX, barY(i), barMax, barH);
    sctx.fillStyle = color(40 + p * 215); sctx.fillRect(barX, barY(i), Math.max(2 * dpr, barMax * p), barH);
  });

  // ---- composite: scene + glow, then the crisp parts on top ----
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(scene, 0, 0);
  if (FILTER_OK) {
    ctx.save(); ctx.filter = `blur(${8 * dpr}px)`; ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.65;
    ctx.drawImage(scene, 0, 0); ctx.restore();
  }

  // input preview (no glow, so it stays readable)
  const inp = cols[0], sw = h.seen.w, sh = h.seen.h;
  if (!previewCv) { previewCv = document.createElement("canvas"); }
  if (previewCv.width !== sw || previewCv.height !== sh) { previewCv.width = sw; previewCv.height = sh; }
  const pcx = previewCv.getContext("2d"), pimg = pcx.createImageData(sw, sh);
  for (let i = 0; i < sw * sh; i++) { const v = payload[h.seen.offset + i]; pimg.data[i * 4] = pimg.data[i * 4 + 1] = pimg.data[i * 4 + 2] = v; pimg.data[i * 4 + 3] = 255; }
  pcx.putImageData(pimg, 0, 0);
  const pw = inp.w, ph = pw * sh / sw;
  ctx.imageSmoothingEnabled = true; ctx.drawImage(previewCv, inp.x, inp.y, pw, ph);
  ctx.strokeStyle = "#13213b"; ctx.lineWidth = dpr; ctx.strokeRect(inp.x, inp.y, pw, ph);

  // labels
  ctx.textBaseline = "alphabetic";
  for (const c of cols) {
    ctx.fillStyle = "#eaf4ff"; ctx.font = FONT(13 * dpr); ctx.fillText(c.title, c.x, 18 * dpr, c.w);
    ctx.fillStyle = "#5d7091"; ctx.font = FONT(11 * dpr, 400); ctx.fillText(c.sub, c.x, 34 * dpr, c.w);
  }
  ctx.font = FONT(15 * dpr);
  h.probs.forEach((p, i) => {
    ctx.fillStyle = i === winner ? "#ffffff" : "#5d7091";
    ctx.fillText(h.classes[i], out.x + 6 * dpr, barY(i) + barH * 0.85);
  });
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5 * dpr;
  ctx.strokeRect(barX - 2 * dpr, barY(winner) - 2 * dpr, barMax + 4 * dpr, barH + 4 * dpr);
}

// ---------- lock panel ----------
const STATE_NAMES = { locked: "Locked", reading: "Reading", opening: "Opening", open: "Open",
  closing: "Closing", denied: "Wrong code", lockout: "Locked out" };

function updatePanel(h) {
  const pill = $("#pill");
  pill.dataset.s = h.state;
  pill.textContent = h.state === "lockout" ? `Locked out ${h.lockout_left} s` : (STATE_NAMES[h.state] || h.state);

  const slots = $("#slots");
  if (slots.children.length !== h.code_len) slots.innerHTML = "<div class='slot'><b></b></div>".repeat(h.code_len);
  [...slots.children].forEach((el, i) => {
    el.classList.toggle("filled", i < h.shown);
    const active = h.state === "reading" && i === h.shown;
    el.style.setProperty("--p", active && h.progress_kind === "digit" ? h.progress : 0);
  });

  const msg = $("#msg");
  msg.textContent = h.error || h.msg;
  msg.classList.toggle("err", !!h.error || h.state === "denied" || h.state === "lockout");

  if (h.pred !== undefined) {
    $("#pred").textContent = h.pred === "0" ? "∅" : h.pred;
    $("#conf").textContent = h.pred === "0" ? `no hand, ${Math.round(h.conf * 100)}% sure` : `fingers, ${Math.round(h.conf * 100)}% sure`;
  }
  const reading = h.state === "reading";
  $("#hold").style.width = `${reading ? h.progress * 100 : 0}%`;
  $("#holdLabel").textContent = !reading ? "" :
    (h.progress_kind === "release" ? "Lower your hand or make a fist" : "Hold the number steady");

  $("#startBtn").disabled = ["open", "opening", "closing", "lockout"].includes(h.state);
  $("#closeBtn").disabled = h.state !== "open";
  if (h.cam) $("#cam").src = "data:image/jpeg;base64," + h.cam;
  $("#camCap").textContent = h.fps ? `Camera, network running at ${h.fps} frames/s` : "Camera";
}

async function post(path) {
  try {
    const r = await fetch(path, { method: "POST" });
    const j = await r.json();
    $("#toast").textContent = j.msg;
  } catch { $("#toast").textContent = "Couldn't reach the lock."; }
}
$("#startBtn").addEventListener("click", () => post("/api/start"));
$("#closeBtn").addEventListener("click", () => post("/api/close"));

// ---------- receive frames (long polling) ----------
let seq = 0, lastHeader = null, lastPayload = null;
async function poll() {
  for (;;) {
    try {
      const r = await fetch(`/api/frame?after=${seq}`, { cache: "no-store" });
      if (r.status === 200) {
        const buf = await r.arrayBuffer(), n = new DataView(buf).getUint32(0, true);
        const h = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
        const payload = new Uint8Array(buf, 4 + n);
        seq = h.seq;
        updatePanel(h);
        if (h.layers.length) { lastHeader = h; lastPayload = payload; render(h, payload); }
      }
    } catch (e) {
      $("#pill").textContent = "Offline"; $("#pill").dataset.s = "denied";
      $("#msg").textContent = "Can't reach the lock. Is the app running?"; $("#msg").classList.add("err");
      await new Promise(res => setTimeout(res, 1500));
    }
  }
}
window.addEventListener("resize", () => { if (lastHeader) render(lastHeader, lastPayload); });
poll();
</script>
</body>
</html>
